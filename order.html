<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .form-wrap {
      max-width: 640px;
      margin-inline: auto;
      padding: var(--space-5) var(--space-4);
      background-color: var(--color-white);
      border: var(--border);
      border-radius: var(--radius);
    }
    .form-note {
      margin-top: var(--space-3);
      font-size: 0.85rem;
      text-align: center;
      color: var(--color-ink-mute);
    }
    @media (max-width: 720px) {
      .form-wrap { padding: var(--space-4) var(--space-3); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">Body Scent</a>
      <nav class="nav">
        <a href="index.html#moods">Mood</a>
        <a href="product.html" class="btn btn--small">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider">
        </div>

        <div class="form-wrap">
          <form id="orderForm">

            <div class="field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="field">
              <label for="contact">เบอร์โทร / Line</label>
              <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="field">
              <label for="items">รายการสินค้า</label>
              <input class="input" type="text" id="items" name="items" required>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input class="input" type="number" id="total" name="total" min="0" inputmode="numeric" required>
            </div>

            <div class="field">
              <label for="note">หมายเหตุ</label>
              <textarea class="textarea" id="note" name="note"></textarea>
            </div>

            <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>

          </form>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <small>&copy; 2026 Body Scent. All rights reserved.</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
