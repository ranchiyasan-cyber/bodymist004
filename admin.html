<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrap {
      overflow-x: auto;
      background-color: var(--color-white);
      border: var(--border);
      border-radius: var(--radius);
    }
    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.2rem;
      text-align: left;
      vertical-align: top;
      border-bottom: var(--border);
    }
    #ordersTable thead th {
      font-family: var(--font-serif-th);
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: var(--color-ink);
      background-color: var(--color-cream-deep);
      border-bottom: 1px solid var(--color-line-strong);
    }
    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
    #ordersTable tbody tr:hover {
      background-color: var(--color-cream);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">Body Scent</a>
      <nav class="nav">
        <a href="product.html" class="btn btn--small">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head">
          <span class="eyebrow">Admin</span>
          <h1>รายการสั่งซื้อ</h1>
          <hr class="divider">
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <small>&copy; 2026 Body Scent. All rights reserved.</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
